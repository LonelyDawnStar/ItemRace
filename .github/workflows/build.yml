name: Build ItemRace

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show checked out revision
        run: |
          git rev-parse HEAD
          grep -n "DEFAULT_COOLDOWN\|cooldownSeconds" src/main/java/kr/minq/itemrace/BiomeTeleportManager.java || true

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Add night vision feature
        run: python3 scripts/patch_night_vision.py

      - name: Build plugin
        run: gradle clean build --stacktrace

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: ItemRace-plugin
          path: build/libs/ItemRace-*.jar
          if-no-files-found: error
